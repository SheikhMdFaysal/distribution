# DigitalOcean App Platform spec (alternative deployment path)
#
# Use this only if you prefer App Platform over the Droplet+Compose path.
# Cost: ~$40/month vs $6/month for Droplet+Compose.
#
# Deploy via: doctl apps create --spec digitalocean/app-platform.yaml
# Or paste this into App Platform's "Edit App Spec" UI.

name: ai-security-platform
region: nyc

# ---------- PostgreSQL (managed database) ----------
databases:
  - name: ai-security-db
    engine: PG
    version: "16"
    size: db-s-dev-database     # $15/mo, 1 GB RAM, 1 vCPU
    num_nodes: 1
    production: false

# ---------- Backend FastAPI ----------
services:
  - name: backend
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    github:
      repo: SheikhMdFaysal/Enterprise-AI-Security-Red-Teaming-Platform
      branch: main
      deploy_on_push: true
    instance_size_slug: basic-xxs    # $5/mo, 512MB RAM
    instance_count: 1
    http_port: 8000
    health_check:
      http_path: /api/v1/health
      initial_delay_seconds: 30
      period_seconds: 20
    envs:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${ai-security-db.DATABASE_URL}
      - key: SECRET_KEY
        scope: RUN_TIME
        type: SECRET
        value: GENERATE_RANDOM_HERE
      - key: ALLOWED_ORIGINS
        scope: RUN_TIME
        value: ${frontend.PUBLIC_URL}
      - key: GOOGLE_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: OPENROUTER_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: GROQ_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: HF_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: NVIDIA_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_MODEL
        value: gemini-2.5-flash
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: ANTHROPIC_MODEL
        value: claude-3-5-haiku-20241022
      - key: OLLAMA_BASE_URL
        value: ""

  # ---------- Frontend Next.js ----------
  - name: frontend
    source_dir: frontend
    dockerfile_path: frontend/Dockerfile
    github:
      repo: SheikhMdFaysal/Enterprise-AI-Security-Red-Teaming-Platform
      branch: main
      deploy_on_push: true
    instance_size_slug: basic-xxs    # $5/mo
    instance_count: 1
    http_port: 3000
    envs:
      - key: NEXT_PUBLIC_API_URL
        scope: BUILD_TIME
        value: ${backend.PUBLIC_URL}

# Note: App Platform does not currently offer a managed Redis at the cheapest tier.
# If you need Redis, add a worker service with redis:7-alpine as a sidecar,
# or move to the Droplet+Compose path which includes Redis natively.
